name: CI/CD Pipeline F1 Scenarios

on:
  push:
    branches:
      # 1) Solución Múltiples Ramas: Ejecutar en main, developer, y cualquier rama que NO sea main o developer
      - main 
      - developer
      # Usar el patrón '*' para ramas de feature, hotfix, o cualquier otro nombre.
      # Excluye main/developer para evitar doble ejecución si ya están explícitamente listadas.
      - '*' 
  pull_request:
    branches:
      - main
      - developer
      - '*'

permissions:
  contents: read

jobs:
  # Job 1: CI (Quality, Testing, and Artifact Generation)
  ci:
    name: Code Quality and Testing
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Set up Python 3.11
        uses: actions/setup-python@v5 
        with:
          python-version: "3.11"
          
      - name: Install dependencies and Quality Tools
        run: |
          python -m pip install --upgrade pip
          # Instalar herramientas de calidad (flake8, Black, isort) y dependencias de proyecto
          pip install flake8 pytest black isort
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          
      # --- Auditoría de Calidad ---
      - name: Check Code Formatting with Black
        run: |
          # 'check' solo verifica si hay cambios necesarios, NO los aplica.
          black --check .
          
      - name: Check Import Sorting with isort
        run: |
          # 'check' solo verifica si los imports están ordenados, NO los ordena.
          isort --check-only .
          
      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings.
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
          
      # --- Pruebas y Generación de Artefactos ---
      - name: Test with pytest
        run: |
          pytest
          
      - name: Generate F1 Scenarios (Run Script)
        run: python championship.py

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: f1-scenarios-csv
          path: '*.csv'
          retention-days: 1 

  # Job 2: CD (Despliegue a S3)
  deploy:
    name: Continuous Deployment to S3
    runs-on: ubuntu-latest
    
    # Dependencia: solo corre si el job 'ci' pasó exitosamente
    needs: [ci] 
    
    # CONDICIÓN CLAVE: solo se ejecuta si el código se sube a la rama 'main'
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: f1-scenarios-csv
          
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          # REEMPLAZAR: Poner tu región de AWS aquí (ej: us-east-1)
          aws-region: us-east-2 
          
      - name: Deploy CSV files to S3
        run: |
          # REEMPLAZAR: Poner el nombre de tu bucket de S3
          aws s3 sync . s3://f1-scenary-results/ \
            --exclude "*" --include "*.csv" 
            
          echo "Despliegue de escenarios CSV completado en S3."